services:
  nacos:
    profiles: ["infra", "full"]
    image: nacos/nacos-server:v2.3.2
    container_name: seckill-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8848/nacos/v1/console/health/liveness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - seckill-net

  mysql-master:
    profiles: ["infra", "full"]
    image: mysql:8.0.32
    container_name: seckill-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: seckill
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/master/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./mysql/master/init/01-master-init.sql:/docker-entrypoint-initdb.d/01-master-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-do-db=seckill_0
      - --binlog-do-db=seckill_1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${DB_PASSWORD:-password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - seckill-net

  mysql-slave:
    profiles: ["infra", "full"]
    image: mysql:8.0.32
    container_name: seckill-mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: seckill
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/slave/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./mysql/slave/init/01-slave-init.sql:/docker-entrypoint-initdb.d/01-slave-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --server-id=2
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --replicate-do-db=seckill_0
      - --replicate-do-db=seckill_1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=1
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${DB_PASSWORD:-password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - seckill-net

  redis:
    profiles: ["infra", "full"]
    image: redis:7.0
    container_name: seckill-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - seckill-net

  rmqnamesrv:
    profiles: ["infra", "full"]
    image: apache/rocketmq:4.9.4
    container_name: seckill-rmqnamesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[N]amesrvStartup' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - seckill-net

  rmqbroker:
    profiles: ["infra", "full"]
    image: apache/rocketmq:4.9.4
    container_name: seckill-rmqbroker
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqbroker -n rmqnamesrv:9876
    depends_on:
      rmqnamesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[B]rokerStartup' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - seckill-net

  app1:
    profiles: ["full"]
    build: .
    container_name: seckill-app1
    environment:
      - SERVER_PORT=${APP1_PORT:-8081}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - NACOS_DISCOVERY_ENABLED=${NACOS_DISCOVERY_ENABLED:-true}
      - NACOS_REGISTER_ENABLED=${NACOS_REGISTER_ENABLED:-true}
      - NACOS_CONFIG_ENABLED=${NACOS_CONFIG_ENABLED:-true}
      - DB_MASTER_HOST=${DB_MASTER_HOST:-mysql-master}
      - DB_SLAVE_HOST=${DB_SLAVE_HOST:-mysql-slave}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - ROCKETMQ_HOST=${ROCKETMQ_HOST:-rmqnamesrv}
      - RAFT_OPTIMIZATION_ENABLED=${RAFT_OPTIMIZATION_ENABLED:-false}
      - RAFT_LEADER_LEASE_SECONDS=${RAFT_LEADER_LEASE_SECONDS:-8}
    ports:
      - "8081:8081"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rmqnamesrv:
        condition: service_healthy
      rmqbroker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[j]ava -jar app.jar' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - seckill-net

  app2:
    profiles: ["full"]
    build: .
    container_name: seckill-app2
    environment:
      - SERVER_PORT=${APP2_PORT:-8082}
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - NACOS_DISCOVERY_ENABLED=${NACOS_DISCOVERY_ENABLED:-true}
      - NACOS_REGISTER_ENABLED=${NACOS_REGISTER_ENABLED:-true}
      - NACOS_CONFIG_ENABLED=${NACOS_CONFIG_ENABLED:-true}
      - DB_MASTER_HOST=${DB_MASTER_HOST:-mysql-master}
      - DB_SLAVE_HOST=${DB_SLAVE_HOST:-mysql-slave}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - ROCKETMQ_HOST=${ROCKETMQ_HOST:-rmqnamesrv}
      - RAFT_OPTIMIZATION_ENABLED=${RAFT_OPTIMIZATION_ENABLED:-false}
      - RAFT_LEADER_LEASE_SECONDS=${RAFT_LEADER_LEASE_SECONDS:-8}
    ports:
      - "8082:8082"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rmqnamesrv:
        condition: service_healthy
      rmqbroker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[j]ava -jar app.jar' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - seckill-net

  gateway:
    profiles: ["full"]
    build:
      context: ./gateway
    container_name: seckill-gateway
    environment:
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:-nacos:8848}
      - REDIS_HOST=${REDIS_HOST:-redis}
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - seckill-net

  nginx:
    profiles: ["full"]
    image: nginx:1.23
    container_name: seckill-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[n]ginx: master process' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - seckill-net

networks:
  seckill-net:
    driver: bridge
