version: '3.8'

services:
  mysql-master:
    image: mysql:8.0.32
    container_name: seckill-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: seckill
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/master/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./mysql/master/init/01-master-init.sql:/docker-entrypoint-initdb.d/01-master-init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    networks:
      - seckill-net

  mysql-slave:
    image: mysql:8.0.32
    container_name: seckill-mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: seckill
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/slave/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./mysql/slave/init/01-slave-init.sql:/docker-entrypoint-initdb.d/01-slave-init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    depends_on:
      - mysql-master
    networks:
      - seckill-net

  redis:
    image: redis:7.0
    container_name: seckill-redis
    ports:
      - "6379:6379"
    networks:
      - seckill-net

  rmqnamesrv:
    image: apache/rocketmq:4.9.4
    container_name: seckill-rmqnamesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    networks:
      - seckill-net

  rmqbroker:
    image: apache/rocketmq:4.9.4
    container_name: seckill-rmqbroker
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqbroker -c /opt/rocketmq-4.9.4/conf/broker.conf
    depends_on:
      - rmqnamesrv
    networks:
      - seckill-net

  app1:
    build: .
    container_name: seckill-app1
    environment:
      - SERVER_PORT=8081
      - DB_MASTER_HOST=mysql-master
      - DB_SLAVE_HOST=mysql-slave
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - ROCKETMQ_HOST=rmqnamesrv
    ports:
      - "8081:8081"
    depends_on:
      - mysql-master
      - mysql-slave
      - redis
      - rmqnamesrv
      - rmqbroker
    networks:
      - seckill-net

  app2:
    build: .
    container_name: seckill-app2
    environment:
      - SERVER_PORT=8082
      - DB_MASTER_HOST=mysql-master
      - DB_SLAVE_HOST=mysql-slave
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - ROCKETMQ_HOST=rmqnamesrv
    ports:
      - "8082:8082"
    depends_on:
      - mysql-master
      - mysql-slave
      - redis
      - rmqnamesrv
      - rmqbroker
    networks:
      - seckill-net

  nginx:
    image: nginx:1.23
    container_name: seckill-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      - app1
      - app2
    networks:
      - seckill-net

networks:
  seckill-net:
    driver: bridge
