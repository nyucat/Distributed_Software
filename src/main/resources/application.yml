server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: seckill-app
  config:
    import: optional:nacos:${spring.application.name}.yaml?refreshEnabled=true
  autoconfigure:
    exclude:
      - org.apache.shardingsphere.spring.boot.ShardingSphereAutoConfiguration
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        file-extension: yaml
        import-check:
          enabled: false
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_REGISTER_ENABLED:false}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:127.0.0.1:8858}
      eager: true
  datasource:
    url: jdbc:mysql://${DB_MASTER_HOST:127.0.0.1}:3306/seckill_0?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: 6379
    timeout: 3000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.seckill.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: seckill_jwt_secret_key_distributed_system
  expiration: 86400000

raft:
  optimization:
    enabled: ${RAFT_OPTIMIZATION_ENABLED:false}
    leader-lease-seconds: ${RAFT_LEADER_LEASE_SECONDS:8}

rocketmq:
  name-server: ${ROCKETMQ_HOST:127.0.0.1}:9876
  producer:
    group: seckill-producer-group
    send-message-timeout: 3000

governance:
  message: governance-default

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
