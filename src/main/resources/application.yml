server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: seckill-app
  # 禁用 Nacos 配置中心导入检查
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
  
  # 使用默认的数据源配置
  datasource:
    url: jdbc:mysql://${DB_MASTER_HOST:127.0.0.1}:3306/seckill_0?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: 6379
    timeout: 3000

  rocketmq:
    name-server: ${ROCKETMQ_HOST:127.0.0.1}:9876
    producer:
      group: seckill-producer-group
      send-message-timeout: 3000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.seckill.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: seckill_jwt_secret_key_distributed_system
  expiration: 86400000 # 24 hours

raft:
  optimization:
    enabled: ${RAFT_OPTIMIZATION_ENABLED:false}
    leader-lease-seconds: ${RAFT_LEADER_LEASE_SECONDS:8}
